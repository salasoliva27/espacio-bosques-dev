name: Tests

# Manual-only since 2026-07-26. This workflow failed on EVERY push (bad
# workspace names + husky postinstall), and each failure emailed. The bugs
# below are fixed, but the suite has never been confirmed green in CI, so the
# push trigger stays off until a manual run passes.
#
# To re-enable: run this workflow from the Actions tab ("Run workflow"). Once
# it is green, uncomment the push/pull_request block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      # --ignore-scripts: the root postinstall runs `husky install`, which has
      # nothing to install against on a fresh CI checkout and fails the job.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      # Workspace is `contracts` in package.json — not @espacio-bosques/contracts.
      - name: Run contract tests
        run: yarn workspace contracts test
      - name: Generate coverage
        run: yarn workspace contracts coverage

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run backend tests
        run: yarn workspace backend test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: yarn lint
